<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPL(A) Quiz</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --line:#2c3744; --fg:#e6edf3; --muted:#8b98a5; --accent:#4f9dff; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.5; }
  .wrap { max-width:780px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .topics { display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:16px; }
  @media(min-width:560px){ .topics { grid-template-columns:1fr 1fr; } }
  label.topic { display:flex; align-items:center; gap:10px; padding:12px 14px; background:#141a21; border:1px solid var(--line); border-radius:10px; cursor:pointer; user-select:none; }
  label.topic:hover { border-color:var(--accent); }
  label.topic input { width:18px; height:18px; accent-color:var(--accent); }
  label.topic .count { margin-left:auto; color:var(--muted); font-size:.85rem; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:#141a21; color:var(--fg); padding:10px 16px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600; }
  button.primary:disabled { opacity:.4; cursor:not-allowed; }
  .link { background:none; border:none; color:var(--accent); padding:4px 6px; }
  .bar { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.9rem; margin-bottom:14px; }
  .qtopic { color:var(--accent); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; }
  .qtext { font-size:1.15rem; font-weight:600; margin:6px 0 16px; }
  .qimg { max-width:100%; border-radius:10px; margin:0 0 16px; display:block; background:#fff; padding:10px; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .opt { text-align:left; padding:14px 16px; line-height:1.4; }
  .opt.correct { background:rgba(63,185,80,.15); border-color:var(--ok); }
  .opt.wrong { background:rgba(248,81,73,.15); border-color:var(--bad); }
  .opt:disabled { cursor:default; opacity:1; }
  .opt .mark { float:right; font-weight:700; }
  .opt.correct .mark { color:var(--ok); }
  .opt.wrong .mark { color:var(--bad); }
  .footer { margin-top:18px; display:flex; justify-content:space-between; align-items:center; }
  .hide { display:none; }
  .big { font-size:2.4rem; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PPL(A) Theory Quiz</h1>
  <p class="sub">902 questions across 9 subjects.</p>

  <div id="setup" class="card">
    <div class="row" style="margin-bottom:14px;">
      <button class="link" id="selAll">Select all</button>
      <button class="link" id="selNone">Clear</button>
    </div>
    <div class="topics" id="topicList"></div>
    <div class="row">
      <button class="primary" id="startBtn">Start quiz</button>
      <span class="sub" id="selInfo" style="margin:0;"></span>
    </div>
  </div>

  <div id="quiz" class="card hide">
    <div class="bar">
      <span id="progress"></span>
      <span id="score"></span>
    </div>
    <div class="qtopic" id="qtopic"></div>
    <div class="qtext" id="qtext"></div>
    <img class="qimg hide" id="qimg" alt="figure">
    <div class="opts" id="opts"></div>
    <div class="footer">
      <button class="link" id="quitBtn">&larr; Topics</button>
      <button class="primary hide" id="nextBtn">Next &rarr;</button>
    </div>
  </div>

  <div id="done" class="card hide" style="text-align:center;">
    <div class="big" id="finalScore"></div>
    <p class="sub" id="finalPct"></p>
    <div class="row" style="justify-content:center;">
      <button class="primary" id="restartBtn">New quiz</button>
    </div>
  </div>
</div>

 "correct": true}, {"text": "Search and Rescue Service (SAR).", "correct": false}, {"text": "Aeronautical Information Service (AIS).", "correct": false}, {"text": "next airport operator en-route.", "correct": false}]}, {"q": "The EOBT (estimated off-block time) is specified in the ATS flight plan as...", "image": null, "options": [{"text": "Standard Time (ST).", "correct": false}, {"text": "Coordinated Universal Time (UTC).", "correct": true}, {"text": "Central European Time (CET).", "correct": false}, {"text": "Local Mean Time (LMT).", "correct": false}]}, {"q": "The specified speed in the ATS flight plan equals: See annex (PFP-051)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-051.jpg", "options": [{"text": "100 m/h.", "correct": false}, {"text": "100 kt.", "correct": true}, {"text": "1000 kt.", "correct": false}, {"text": "100 km/h.", "correct": false}]}, {"q": "What is the nature of the flight shown in the given ATC flight plan? See annex (PFP-051a)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-051a.jpg", "options": [{"text": "Border crossing flight.", "correct": false}, {"text": "Flight under instrument flight rules.", "correct": false}, {"text": "Night flight under visual flight rules.", "correct": true}, {"text": "Traffic pattern under visual flight rules.", "correct": false}]}, {"q": "What must be considered for cross-border flights?", "image": null, "options": [{"text": "Transmission of hazard reports", "correct": false}, {"text": "Approved exceptions", "correct": false}, {"text": "Requires flight plans", "correct": true}, {"text": "Regular location messages", "correct": false}]}, {"q": "A flight plan has been filed for a flight departing at an uncontrolled aerodrome. When has the actual take-off time been transmitted to ATC?", "image": null, "options": [{"text": "Immediately after take-off.", "correct": true}, {"text": "Upon request from ATC.", "correct": false}, {"text": "When landing is assured.", "correct": false}, {"text": "At deviation from expected off-block time by more than 15 min.", "correct": false}]}, {"q": "During a flight with a flight plan submitted, landing is conducted at an airfield other than the destination stated in the filed flight plan. Who has to be contacted by the pilot immediately?", "image": null, "options": [{"text": "The police department.", "correct": false}, {"text": "Aeronatical Information Service (AIS).", "correct": true}, {"text": "The flight manager on duty.", "correct": false}, {"text": "Local office for aereal supervision.", "correct": false}]}, {"q": "Given the following data: Take-Off fuel = 200 lbs Alternate fuel = 40 lbs Final reserve fuel = 30 lbs After 25 minutes the remaining fuel is 120 lbs. Assuming that fuel flow will remain unchanged, the remaining time to the destination should not exceed:", "image": null, "options": [{"text": "37.5 min", "correct": false}, {"text": "15.6 min", "correct": true}, {"text": "59.4 min", "correct": false}, {"text": "20.0 min", "correct": false}]}, {"q": "The center of gravity has to be located...", "image": null, "options": [{"text": "between the front and the rear C.G. limit.", "correct": true}, {"text": "behind the rear C.G. limit.", "correct": false}, {"text": "in front of the front C.G. limit.", "correct": false}, {"text": "right of the lateral C. G. limit.", "correct": false}]}, {"q": "The result of a rear C.G. position is...", "image": null, "options": [{"text": "an increased fuel consumption.", "correct": false}, {"text": "a decrease of range.", "correct": false}, {"text": "a decrease of stability.", "correct": true}, {"text": "an increased stall speed.", "correct": false}]}, {"q": "An aircraft must be loaded and operated in such a way that the center of gravity (CG) stays within the approved limits during all phases of flight. This is done to ensure...", "image": null, "options": [{"text": "that the aircraft does not exceed the maximum permissible airspeed during a descent.", "correct": false}, {"text": "that the aircraft does not stall.", "correct": false}, {"text": "that the aircraft does not tip over on its tail while it is being loaded.", "correct": false}, {"text": "both stability and controllability of the aircraft.", "correct": true}]}, {"q": "The result of a front C.G. position is: 1. Increase in stability. 2. Increase in fuel consumption. 3. Increase in stall speed. 4. Increase in range.", "image": null, "options": [{"text": "2, 4", "correct": false}, {"text": "1, 2", "correct": false}, {"text": "1, 2, 3", "correct": true}, {"text": "2, 3, 4", "correct": false}]}, {"q": "The conversion factor from kilogram [kg] into pounds [lb] is...", "image": null, "options": [{"text": "kg x 2 = lb.", "correct": false}, {"text": "kg x 2.205 = lb.", "correct": true}, {"text": "kg / 2.205 = lb.", "correct": false}, {"text": "kg x 0.454 = lb.", "correct": false}]}, {"q": "Baggage and cargo must be properly stowed and fastened, otherwise a shift of the cargo may cause...", "image": null, "options": [{"text": "continuous attitudes which can be corrected by the pilot using the flight controls.", "correct": false}, {"text": "structural damage, angle of attack stability, velocity stability.", "correct": false}, {"text": "uncontrollable attitudes, structural damage, risk of injuries.", "correct": true}, {"text": "calculable instability if the C.G. is shifting by less than 10 %.", "correct": false}]}, {"q": "The total weight of an aeroplane is acting vertically through the...", "image": null, "options": [{"text": "stagnation point.", "correct": false}, {"text": "neutral point.", "correct": false}, {"text": "center of pressure.", "correct": false}, {"text": "center of gravity.", "correct": true}]}, {"q": "During an unaccelerated flight...", "image": null, "options": [{"text": "drag equals lift and thrust equals gravity.", "correct": false}, {"text": "thrust equals the sum of drag and gravity.", "correct": false}, {"text": "thrust equals lift and drag equals gravity.", "correct": false}, {"text": "thrust equals drag and lift equals gravity.", "correct": true}]}, {"q": "The term \"datum\" with regard to a mass and balance calculation defines...", "image": null, "options": [{"text": "the point on the lateral axis of an aeroplane or its extension from which the centers of gravity of all masses are referenced.", "correct": false}, {"text": "the point on the vertical axis of an aeroplane or its extension from which the centers of gravity of all masses are referenced.", "correct": false}, {"text": "the point on the longitudinal axis of an aeroplane or its extension from which the centers of gravity of all masses are referenced.", "correct": true}, {"text": "the distance from the reference plane to the center of gravity of an aircraft.", "correct": false}]}, {"q": "The distance between the center of gravity and the datum is called...", "image": null, "options": [{"text": "span width.", "correct": false}, {"text": "balance arm.", "correct": true}, {"text": "lever.", "correct": false}, {"text": "torque.", "correct": false}]}, {"q": "Calculated take-off mass = 2300 lbs, calculated CG = 95.75 in, fuel burn = 170 lbs on station 87.00 in. Where is the CG situated after the landing?", "image": null, "options": [{"text": "97.39 in", "correct": false}, {"text": "96.45 in", "correct": true}, {"text": "94.11 in", "correct": false}, {"text": "96.57 in", "correct": false}]}, {"q": "Given values: Calculated take-off mass = 746 kg calculated CG = 37.1 cm fuel burn = 30.5 l on station 45 cm. Where is the CG situated after the landing?", "image": null, "options": [{"text": "37.2 cm", "correct": false}, {"text": "37.5 cm", "correct": false}, {"text": "36.3 cm", "correct": false}, {"text": "36.9 cm", "correct": true}]}, {"q": "Calculated take-off mass = 1082 kg, calculated CG = 0.254 m, fuel burn = 55 l on station 0.40 m. Where is the CG situated after the landing?", "image": null, "options": [{"text": "24.6 cm", "correct": false}, {"text": "25.2 cm", "correct": false}, {"text": "25.4 cm", "correct": false}, {"text": "24.8 cm", "correct": true}]}, {"q": "The position of the center of gravity (including fuel) equals...", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-053e.jpg", "options": [{"text": "37.1 cm.", "correct": true}, {"text": "0.401 m.", "correct": false}, {"text": "37.3 cm.", "correct": false}, {"text": "0.403 m.", "correct": false}]}, {"q": "Which is the most recently determined empty mass and the associated center of gravity (CG) arm from the aircraft documentation? See annex (PFP-006)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-006.jpg", "options": [{"text": "5 kg; 1.3 m", "correct": false}, {"text": "4 kg; 1.1 m", "correct": false}, {"text": "498 kg; 280.59 m", "correct": true}, {"text": "512 kg; 285.39 m", "correct": false}]}, {"q": "How does wind affect the take-off performance?", "image": null, "options": [{"text": "Tailwind aids the aircraft in overcoming the initial drag at the commencement of the take-off roll. The take-off distance will decrease", "correct": false}, {"text": "Tailwind reduces the relative wind on the airfoil. The take-off distance will increase", "correct": true}, {"text": "Headwind causes an increased airflow around the wing. The take-off distance will increase", "correct": false}, {"text": "Headwind imposes an increased drag on the aircraft. The take-off distance will increase", "correct": false}]}, {"q": "It is possible that the surface wind speed at an airport is reduced due to friction. When a surface area with a minor tailwind condition is left during the initial climb, the pilot might expect...", "image": null, "options": [{"text": "an increase in airspeed and rate of climb due to decreasing tailwind.", "correct": false}, {"text": "a deacrease in airspeed and climb performance due to decreasing tailwind.", "correct": false}, {"text": "an increase in airspeed and rate of climb due to increasing tailwind.", "correct": false}, {"text": "a decrease in airspeed and rate of climb due to increasing tailwind.", "correct": true}]}, {"q": "The speed Vx means...", "image": null, "options": [{"text": "that a given altitude is reached within minimum distance.", "correct": true}, {"text": "that a given altitude is reached within minimum flight time.", "correct": false}, {"text": "maximum altitude gain per 10 % power.", "correct": false}, {"text": "that a given altitude is reached with minimum fuel consumption.", "correct": false}]}, {"q": "The term \"steady flight\" is defined as...", "image": null, "options": [{"text": "flight with a steady power setting without changing course.", "correct": false}, {"text": "climb or descent with a constant climb or descent rate in calm weather conditions.", "correct": false}, {"text": "unaccelerated flight. The four forces thrust, drag, lift, and weight are in equilibrium.", "correct": true}, {"text": "flight in smooth air without turbulence and a perfectly trimmed aircraft.", "correct": false}]}, {"q": "The speed Vy is defined as...", "image": null, "options": [{"text": "best speed of climb.", "correct": false}, {"text": "best angle of climb.", "correct": false}, {"text": "best distance of climb.", "correct": false}, {"text": "best rate of climb.", "correct": true}]}, {"q": "The speed VFE is defined as...", "image": null, "options": [{"text": "stalling or minimum steady flight speed with the flaps retracted.", "correct": false}, {"text": "maximum flap extended speed.", "correct": true}, {"text": "stalling or minimum steady flight speed with the flaps extended.", "correct": false}, {"text": "maximum landing gear extended speed.", "correct": false}]}, {"q": "The speed VS0 is defined as...", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/FPP-Q79.jpg", "options": [{"text": "maximum landing gear extended speed.", "correct": false}, {"text": "stalling speed or minimum steady flight speed obtained in a specific configuration.", "correct": false}, {"text": "stalling speed or minimum steady flight speed in landing configuration.", "correct": true}, {"text": "never-exceed speed.", "correct": false}]}, {"q": "Which climb speed may be used to optimize the rate of climb (e.g. to reach a desired altitude within minimum time)?", "image": null, "options": [{"text": "Vy, the best angle of climb speed", "correct": false}, {"text": "Vy, the best rate of climb speed", "correct": true}, {"text": "Vx, the best rate of climb speed", "correct": false}, {"text": "Vx, the best angle of climb speed", "correct": false}]}, {"q": "A pilot wants to take off on runway 36, the reported wind is 240 degrees, 12 knots. What is the value of the wind components acting on the aircraft on take-off and landing?", "image": null, "options": [{"text": "Crosswind from the right 10.4 kt. Tailwind 6 kt.", "correct": false}, {"text": "Crosswind from the left 10.4 kt. Tailwind 6 kt.", "correct": true}, {"text": "Crosswind from the left 6 kt. Tailwind 10.4 kt.", "correct": false}, {"text": "Crosswind from the right 6 kt. Headwind 10.4 kt.", "correct": false}]}, {"q": "What is the take-off distance at 750 kg take-off mass, standard (ISA) conditions at an elevation of 4000 ft with 5 kt tailwind? See annex (PFP-009)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-009.jpg", "options": [{"text": "900 m", "correct": true}, {"text": "320 m", "correct": false}, {"text": "630 m", "correct": false}, {"text": "480 m", "correct": false}]}, {"q": "What is the take-off distance at 705 kg take-off mass, OAT 20° C, QNH 1013 hPa at an elevation of 3500 ft with 5 kt tailwind? See annex (PFP-009)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-009.jpg", "options": [{"text": "720 m", "correct": false}, {"text": "880 m", "correct": true}, {"text": "790 m", "correct": false}, {"text": "820 m", "correct": false}]}, {"q": "A pilot wants to take off on runway 36, the reported wind is 240 degrees 12 knots. What are the wind components acting on the aircraft on take-off and landing?", "image": null, "options": [{"text": "Crosswind from the right 10.4 kt. Tailwind 6 kt.", "correct": false}, {"text": "Crosswind from the right 6 kt. Headwind 10.4 kt.", "correct": false}, {"text": "Crosswind from the left 10.4 kt. Tailwind 6 kt.", "correct": true}, {"text": "Crosswind from the left 6 kt. Tailwind 10.4 kt.", "correct": false}]}, {"q": "Given the following conditions, the fuel consumption equals... Pressure altitude: 2000 ft Temperature: 31° C RPM: 2400 See annex (PFP-012)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-012.jpg", "options": [{"text": "19.5 l/h.", "correct": true}, {"text": "19.1 l/h.", "correct": false}, {"text": "21.7 l/h.", "correct": false}, {"text": "22.8 l/h.", "correct": false}]}, {"q": "Given the following information, what range can be achieved? Outside air temperature: 22° C Pressure altitude: 2000 ft Power: 55 % See annex (PFP-013)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-013.jpg", "options": [{"text": "550 NM", "correct": false}, {"text": "480 NM", "correct": false}, {"text": "450 NM", "correct": false}, {"text": "500 NM", "correct": true}]}, {"q": "Given the following conditions, the TAS equals... Outside air temperature: 10° C Pressure altitude: 6000 ft Power: 65 % See annex (PFP-014)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-014.jpg", "options": [{"text": "96 kt.", "correct": false}, {"text": "92 kt.", "correct": true}, {"text": "88 kt.", "correct": false}, {"text": "100 kt.", "correct": false}]}, {"q": "Given the following conditions, the TAS equals... Outside air temperature: -2° C Pressure altitude: 8000 ft Power: 75 % See annex (PFP-014)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-014.jpg", "options": [{"text": "104 kt.", "correct": true}, {"text": "100 kt.", "correct": false}, {"text": "95 kt.", "correct": false}, {"text": "110 kt.", "correct": false}]}, {"q": "Which maximum rate of climb can the aircraft reach at 9000 ft pressure altitude and OAT 12° C? See annex (PFP-011)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-011.jpg", "options": [{"text": "200 ft/min", "correct": true}, {"text": "250 ft/min", "correct": false}, {"text": "350 ft/min", "correct": false}, {"text": "300 ft/min", "correct": false}]}, {"q": "Which is the maximum rate of climb for the aircraft at 6500 ft pressure altitude and an OAT of 0° C? See annex (PFP-011)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-011.jpg", "options": [{"text": "480 ft / min", "correct": true}, {"text": "400 ft / min", "correct": false}, {"text": "520 ft / min", "correct": false}, {"text": "800 ft / min", "correct": false}]}, {"q": "What is the fuel flow and the true airspeed for cruise flight with 60 % power in flight level 85 at an OAT of -25° C? See annex (PFP-014)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-014.jpg", "options": [{"text": "Fuel flow: 17 l. TAS: 81 kt.", "correct": false}, {"text": "Fuel flow: 17.5 l. TAS: 83 kt.", "correct": false}, {"text": "Fuel flow: 20 l. TAS: 89 kt.", "correct": false}, {"text": "Fuel flow: 18.5 l. TAS: 85 kt.", "correct": true}]}, {"q": "What is the required fuel to climb from FL 65 to FL 95 under the following conditions? Aircraft mass: 3000 lb. OAT in FL 65: -5° C OAT in FL 95: -15° C See annex (PFP-023)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-023.jpg", "options": [{"text": "1 GAL", "correct": true}, {"text": "2 GAL", "correct": false}, {"text": "6 GAL", "correct": false}, {"text": "3 GAL", "correct": false}]}, {"q": "What is the required distance to climb from FL 65 to FL 95 under the following conditions: Aircraft mass: 3000 lb. OAT in FL 65: -5° C OAT in FL 95: -15° C See annex (PFP-023)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-023.jpg", "options": [{"text": "6 NM", "correct": true}, {"text": "3 NM", "correct": false}, {"text": "16 NM", "correct": false}, {"text": "10 NM", "correct": false}]}, {"q": "What is the purpose of \"interception lines\" in visual navigation?", "image": null, "options": [{"text": "To visualize the range limitation from the departure aerodrome", "correct": false}, {"text": "They help to continue the flight when flight visibility drops below VFR minima", "correct": false}, {"text": "To mark the next available en-route airport during the flight", "correct": false}, {"text": "They are used as easily recognizable guidance upon a possible loss of orientation", "correct": true}]}, {"q": "The VFR semicircular rules are based on the...", "image": null, "options": [{"text": "true course (TC).", "correct": false}, {"text": "magnetic heading (MH).", "correct": false}, {"text": "magnetic course (MC).", "correct": true}, {"text": "true heading (TH).", "correct": false}]}, {"q": "The upper limit of LO R 16 equals... See annex (PFP-056)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-056.jpg", "options": [{"text": "FL150.", "correct": false}, {"text": "1 500 m MSL.", "correct": false}, {"text": "1 500 ft MSL.", "correct": true}, {"text": "1.500 ft GND.", "correct": false}]}, {"q": "The upper limit of LO R 4 equals... See annex (PFP-030)", "image": "https://raw.githubusercontent.com/antiprosynthesis/ppl-a/main/figures/PFP-030.jpg", "options": [{"text": "4.500 ft AGL.", "correct": false}, {"text": "4.500 ft MSL.", "correct": true}, {"text": "1.500 ft MSL.", "correct": false}, {"text": "1.500 ft AGL.", "correct": false}]}, {"q": "Considering the following fuel data, how much trip fuel is required? Fuel for start-up and taxi: 5 L Fuel for take-off and climb: 12 L Fu const $ = id => document.getElementById(id);

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// build topic checkboxes
const list = $('topicList');
DATA.forEach((t,i)=>{
  const l=document.createElement('label'); l.className='topic';
  l.innerHTML=`<input type="checkbox" value="${i}" checked><span>${t.name}</span><span class="count">${t.questions.length}</span>`;
  list.appendChild(l);
});
const boxes=()=>[...list.querySelectorAll('input')];
function updateInfo(){
  const sel=boxes().filter(b=>b.checked);
  const n=sel.reduce((s,b)=>s+DATA[+b.value].questions.length,0);
  $('selInfo').textContent = sel.length? `${sel.length} topic(s), ${n} questions` : 'Select at least one topic';
  $('startBtn').disabled = sel.length===0;
}
list.addEventListener('change',updateInfo);
$('selAll').onclick=()=>{boxes().forEach(b=>b.checked=true);updateInfo();};
$('selNone').onclick=()=>{boxes().forEach(b=>b.checked=false);updateInfo();};
updateInfo();

let pool=[], idx=0, correct=0, answered=false, order=[];

function buildPool(){
  const sel=boxes().filter(b=>b.checked).map(b=>+b.value);
  pool=[];
  sel.forEach(ti=>DATA[ti].questions.forEach(q=>pool.push({...q, topic:DATA[ti].name})));
  shuffle(pool);
}

function startQuiz(){
  buildPool();
  idx=0; correct=0;
  $('setup').classList.add('hide');
  $('done').classList.add('hide');
  $('quiz').classList.remove('hide');
  render();
}

function render(){
  answered=false;
  const q=pool[idx];
  $('progress').textContent=`Question ${idx+1} / ${pool.length}`;
  $('score').textContent=`Score ${correct}`;
  $('qtopic').textContent=q.topic;
  $('qtext').textContent=q.q;
  const img=$('qimg');
  if(q.image){ img.src=q.image; img.classList.remove('hide'); } else { img.classList.add('hide'); img.removeAttribute('src'); }
  const opts=$('opts'); opts.innerHTML='';
  order=shuffle(q.options.map((o,i)=>i));
  order.forEach(oi=>{
    const o=q.options[oi];
    const btn=document.createElement('button');
    btn.className='opt'; btn.textContent=o.text;
    btn.onclick=()=>choose(btn,o);
    opts.appendChild(btn);
  });
  $('nextBtn').classList.add('hide');
}

function choose(btn,opt){
  if(answered) return;
  answered=true;
  const q=pool[idx];
  if(opt.correct) correct++;
  [...$('opts').children].forEach((b,k)=>{
    const o=q.options[order[k]];
    b.disabled=true;
    if(o.correct){ b.classList.add('correct'); b.innerHTML+=' <span class="mark">&#10003;</span>'; }
    else if(b===btn){ b.classList.add('wrong'); b.innerHTML+=' <span class="mark">&#10007;</span>'; }
  });
  $('score').textContent=`Score ${correct}`;
  $('nextBtn').classList.remove('hide');
}

function next(){
  idx++;
  if(idx>=pool.length){ finish(); } else { render(); }
}

function finish(){
  $('quiz').classList.add('hide');
  $('done').classList.remove('hide');
  const pct=Math.round(100*correct/pool.length);
  $('finalScore').textContent=`${correct} / ${pool.length}`;
  $('finalPct').textContent=`${pct}% correct`;
}

$('startBtn').onclick=startQuiz;
$('nextBtn').onclick=next;
$('restartBtn').onclick=()=>{ $('done').classList.add('hide'); $('setup').classList.remove('hide'); };
$('quitBtn').onclick=()=>{ $('quiz').classList.add('hide'); $('setup').classList.remove('hide'); };
</script>
</body>
</html>
