<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C150 Cockpit Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: the panel photo is the instrument; the club's checklist card rides alongside it. */
:root {
  --bg: #e8ebee;
  --surface: #f7f8f9;
  --surface-2: #dde2e6;
  --ink: #13181d;
  --muted: #55606b;
  --line: #c3cad1;
  --accent: #0d7a7c;
  --accent-ink: #ffffff;
  --ok: #1d8048;
  --warn: #a2640f;
  --bad: #bf2f2a;
  --shadow: 0 10px 30px rgba(10, 20, 30, .18);
  /* card header colours, taken from the laminated checklist */
  --hdr-teal: #127c85;
  --hdr-gray: #5a6067;
  --hdr-ink: #ffffff;
  --placard: #f2cf2a;
  --placard-ink: #17140a;
  --em-ink: #a3141d;
  --sub-ink: #a3141d;
  --stage-bg: #0b0c0d;
  /* things drawn on top of the photo stay the same in both themes */
  --hud-bg: rgba(14, 16, 19, .88);
  --hud-ink: #f4f2ea;
  --hud-muted: #b9b6ab;
  --hud-line: rgba(255, 255, 255, .2);
  --hs: #f7d23e;
  --rocker: #e9e6de;
  --rocker-on: #2fd07a;
  --master: #c4242b;
  --f-ui: "B612", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "B612 Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1114; --surface: #161b20; --surface-2: #1f262d; --ink: #e5eaee; --muted: #8c98a4; --line: #2b343d;
    --accent: #3cb4b2; --accent-ink: #061d1d; --ok: #48c07a; --warn: #e2a64a; --bad: #ee6a5d;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); --hdr-gray: #474d54; --hdr-teal: #127580; --sub-ink: #ee6a5d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1114; --surface: #161b20; --surface-2: #1f262d; --ink: #e5eaee; --muted: #8c98a4; --line: #2b343d;
  --accent: #3cb4b2; --accent-ink: #061d1d; --ok: #48c07a; --warn: #e2a64a; --bad: #ee6a5d;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); --hdr-gray: #474d54; --hdr-teal: #127580; --sub-ink: #ee6a5d;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--f-ui);
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1500px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
}
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
.top h1 { margin: 0; font: 700 26px/1 var(--f-head); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.top .reg { font: 700 13px var(--f-mono); padding: 2px 7px; border-radius: 3px; background: var(--ink); color: var(--bg); letter-spacing: .06em; }
.top p { margin: 0; color: var(--muted); font-size: 12.5px; }

.app { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .app { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } }
.cockpit { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.side { min-width: 0; }
@media (min-width: 1100px) { .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; } }

/* ---------- run bar ---------- */
.runbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  display: grid; gap: 8px 12px; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  box-shadow: var(--shadow);
}
.rb-title { font: 700 19px/1.1 var(--f-head); letter-spacing: .05em; text-transform: uppercase; }
.rb-title .tag { display: inline-block; font: 700 11px var(--f-ui); letter-spacing: .08em; padding: 2px 6px; border-radius: 3px; vertical-align: 3px; margin-right: 6px; background: var(--surface-2); color: var(--muted); }
.rb-title .tag.em { background: var(--placard); color: var(--em-ink); }
.rb-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.rb-sub.scen { color: var(--ink); font-size: 14.5px; }
.rb-stats { display: flex; gap: 10px; font: 700 13px var(--f-mono); font-variant-numeric: tabular-nums; justify-content: flex-end; flex-wrap: wrap; }
.rb-stats .err { color: var(--bad); }
.rb-btns { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
@media (min-width: 700px) { .runbar { grid-template-columns: minmax(0, 1fr) auto auto; } .rb-btns { grid-column: auto; } }
@media (max-width: 699px) {
  .runbar { padding: 8px 10px; gap: 6px 10px; align-items: start; }
  .rb-title { font-size: 16px; }
  .rb-title .tag { font-size: 9.5px; padding: 2px 4px; vertical-align: 2px; }
  .rb-sub:not(.scen) { display: none; }
  .rb-sub.scen { font-size: 13px; }
  .rb-stats { font-size: 12px; gap: 8px; padding-top: 2px; }
}

.btn {
  cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 6px; padding: 7px 12px; font-size: 13px; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 9px; font-size: 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- stage ---------- */
.stage-wrap { position: relative; border-radius: 8px; overflow: hidden; background: var(--stage-bg); box-shadow: var(--shadow); }
.stage-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.stage { position: relative; width: 100%; aspect-ratio: 5 / 3; container-type: inline-size; user-select: none; -webkit-user-select: none; }
.stage > img.photo { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; display: block; pointer-events: none; }
.tools { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; gap: 4px; }
.tools button {
  cursor: pointer; border: 1px solid var(--hud-line); background: var(--hud-bg); color: var(--hud-ink);
  border-radius: 5px; padding: 5px 9px; font: 700 12px var(--f-ui); min-width: 30px;
}
.tools button[aria-pressed="true"] { background: var(--hs); color: #111; }

.hs {
  position: absolute; cursor: pointer; padding: 0; margin: 0;
  background: transparent; border: 2px solid transparent; border-radius: 6px;
  transition: border-color .12s, background-color .12s;
}
.hs:hover, .hs:focus-visible { border-color: var(--hs); background: rgba(247, 210, 62, .12); outline: none; }
.hs .tag {
  position: absolute; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%);
  white-space: nowrap; pointer-events: none; display: none;
  background: var(--hud-bg); color: var(--hud-ink); font: 700 max(9px, .85cqw)/1.2 var(--f-ui);
  padding: 2px 5px; border-radius: 3px; letter-spacing: .02em;
}
.hs:hover .tag { display: block; }
.stage.no-names .hs:hover .tag { display: none; }
.stage.labels .hs { border-color: rgba(247, 210, 62, .75); }
.stage.labels .hs .tag { display: block; }
.grip { display: none; }
.stage.editing .hs, .stage.editing .inset { border: 2px dashed var(--hs) !important; background: rgba(247, 210, 62, .14); touch-action: none; cursor: move; }
.stage.editing .hs .tag { display: block; }
.stage.editing .grip { display: block; position: absolute; right: -7px; bottom: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--hs); border: 2px solid #111; cursor: nwse-resize; z-index: 3; }
.stage.editing .inset.yoke .hs-in { pointer-events: none; }

.hs.pulse, .hs-in.pulse, .sbtn.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(247, 210, 62, .0); border-color: var(--hs); }
  50% { box-shadow: 0 0 0 6px rgba(247, 210, 62, .55); border-color: var(--hs); }
}
.hs.flash-bad, .hs-in.flash-bad, .sbtn.flash-bad { animation: flashbad .5s ease-out 1; }
.hs.flash-ok, .hs-in.flash-ok, .sbtn.flash-ok { animation: flashok .5s ease-out 1; }
@keyframes flashbad { 0% { box-shadow: 0 0 0 4px rgba(239, 70, 60, .9); border-color: #ef463c; } 100% { box-shadow: 0 0 0 0 rgba(239, 70, 60, 0); } }
@keyframes flashok { 0% { box-shadow: 0 0 0 4px rgba(60, 200, 120, .9); border-color: #3cc878; } 100% { box-shadow: 0 0 0 0 rgba(60, 200, 120, 0); } }
@media (prefers-reduced-motion: reduce) {
  .hs.pulse, .hs-in.pulse, .sbtn.pulse { animation: none; border-color: var(--hs); box-shadow: 0 0 0 4px rgba(247, 210, 62, .6); }
  .hs.flash-bad, .hs.flash-ok, .hs-in.flash-bad, .hs-in.flash-ok, .sbtn.flash-ok, .sbtn.flash-bad { animation: none; }
}

.badge {
  position: absolute; transform: translate(-50%, -100%); pointer-events: none; z-index: 2;
  background: var(--hs); color: #111; font: 700 max(9px, .8cqw)/1 var(--f-mono);
  padding: .3cqw .5cqw; border-radius: 3px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0, 0, 0, .5);
}

/* ---------- insets drawn over the photo ---------- */
.inset { position: absolute; z-index: 1; border-radius: .6cqw; }
.inset.yoke {
  background: var(--hud-bg); border: 1px solid var(--hud-line); color: var(--hud-ink);
  display: flex; flex-direction: column; justify-content: space-between; padding: .5cqw .6cqw .4cqw;
  box-shadow: 0 .3cqw 1cqw rgba(0, 0, 0, .5);
}
.in-cap { font: 700 max(7px, .62cqw)/1 var(--f-ui); letter-spacing: .08em; color: var(--hud-muted); text-transform: uppercase; }
.in-row { display: flex; justify-content: space-between; align-items: flex-end; gap: .4cqw; }
.hs-in {
  cursor: pointer; background: transparent; border: 2px solid transparent; border-radius: .4cqw; color: var(--hud-ink);
  padding: .15cqw .1cqw; display: flex; flex-direction: column; align-items: center; gap: .2cqw; min-width: 0; flex: 1 1 0;
}
.hs-in:hover, .hs-in:focus-visible { border-color: var(--hs); outline: none; }
.hs-in .lb { font: 700 max(6.5px, .6cqw)/1.05 var(--f-ui); letter-spacing: .02em; text-align: center; white-space: nowrap; }
.rk {
  display: block; width: 1.5cqw; height: 2.5cqw; border-radius: .25cqw; background: var(--rocker);
  border: 1px solid #000; position: relative; overflow: hidden;
  background-image: linear-gradient(180deg, transparent 47%, rgba(0, 0, 0, .35) 50%, transparent 53%);
}
.rk::after { content: ""; position: absolute; left: 12%; right: 12%; height: 38%; top: 31%; border-radius: .15cqw; background: rgba(0, 0, 0, .18); }
.on .rk::after, .rk.on::after { top: 6%; background: var(--rocker-on); }
.off .rk::after, .rk.off::after { top: 56%; background: rgba(0, 0, 0, .55); }
.mr { display: flex; gap: 2px; }
.mr .rk { background-color: var(--master); }
.key .kf {
  width: 2.7cqw; height: 2.7cqw; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 40% 35%, #8d8f93, #3b3d41 70%); border: 1px solid #000;
}
.key .kb {
  position: absolute; left: 50%; top: 14%; width: 22%; height: 72%; margin-left: -11%; border-radius: .2cqw;
  background: #d9d3c2; transform: rotate(var(--kr, 0deg)); transition: transform .2s;
}
.key .kpos { font: 700 max(6.5px, .58cqw)/1 var(--f-mono); color: var(--hs); min-height: 1em; }

.inset.fuel {
  padding: 0; overflow: hidden; border: 2px solid var(--hud-line); background: #000; cursor: pointer;
  box-shadow: 0 .3cqw 1cqw rgba(0, 0, 0, .55);
}
.inset.fuel img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; }
.inset.fuel .in-cap { position: absolute; left: 0; right: 0; top: 0; padding: .35cqw .5cqw; background: var(--hud-bg); }
.inset.fuel:hover, .inset.fuel:focus-visible { border-color: var(--hs); outline: none; }
.inset.fuel .fstate { position: absolute; right: .4cqw; bottom: .4cqw; }
.inset.fuel .fstate:empty { display: none; }
.inset.fuel .fstate { background: var(--hs); color: #111; font: 700 max(9px, .8cqw)/1 var(--f-mono); padding: .3cqw .5cqw; border-radius: 3px; }

/* ---------- strip of off-panel actions ---------- */
.strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.strip .lbl { font: 600 13px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.sbtn {
  cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 11px; font: 700 11.5px var(--f-ui); letter-spacing: .03em; text-transform: uppercase;
}
.sbtn:hover { border-color: var(--accent); }

/* ---------- side panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font: 700 15px/1.1 var(--f-head); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.panel p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { cursor: pointer; border: 0; background: transparent; padding: 8px 6px; font-weight: 700; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.next {
  cursor: pointer; text-align: left; border: 0; border-radius: 7px; padding: 12px 14px;
  background: var(--placard); color: var(--placard-ink); display: grid; gap: 2px;
}
.next .k { font: 700 11px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.next .v { font: 700 21px/1.05 var(--f-head); letter-spacing: .04em; text-transform: uppercase; }
.next .s { font-size: 12px; opacity: .8; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.row {
  cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center;
  border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; padding: 8px 10px;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .nm { font: 600 15px/1.1 var(--f-head); letter-spacing: .05em; text-transform: uppercase; }
.row .ct { font: 400 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { font: 700 10px var(--f-ui); letter-spacing: .08em; padding: 3px 6px; border-radius: 3px; text-transform: uppercase; white-space: nowrap; }
.pill.new { border: 1px solid var(--line); color: var(--muted); }
.pill.due { background: var(--placard); color: var(--placard-ink); }
.pill.ok { color: var(--ok); border: 1px solid currentColor; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- checklist card ---------- */
.card { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.card-h { font: 700 16px/1 var(--f-head); letter-spacing: .07em; text-transform: uppercase; text-align: center; padding: 7px 10px; background: var(--hdr-gray); color: var(--hdr-ink); }
.card-h.teal { background: var(--hdr-teal); }
.card-h.yellow { background: var(--placard); color: var(--placard-ink); }
.card-h.em { background: var(--placard); color: var(--em-ink); }
.lines { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.ln { display: flex; align-items: baseline; gap: 6px; font: 700 12.5px/1.3 var(--f-ui); text-transform: uppercase; }
.ln .ic { width: 1.6em; flex: none; font-family: var(--f-mono); text-align: center; }
.ln .it { flex: 0 1 auto; min-width: 0; }
.ln .dt { flex: 1 1 12px; border-bottom: 1px dotted var(--muted); transform: translateY(-4px); opacity: .6; min-width: 10px; }
.ln .vl { flex: 0 1 auto; text-align: right; min-width: 0; }
.ln.clean .ic, .ln.ok .ic { color: var(--ok); }
.ln.retry .ic, .ln.order .ic { color: var(--warn); }
.ln.shown .ic, .ln.miss .ic { color: var(--bad); }
.ln.miss .it, .ln.miss .vl { color: var(--bad); }
.ln.ph .bar { flex: 1; height: 9px; border-radius: 2px; background: var(--surface-2); }
.ln.cue { color: var(--accent); }
.ln.act { font-weight: 400; }
.ln.act .ic { color: var(--muted); }
.ln.extra .ic, .ln.extra .it { color: var(--bad); }
.sub { font: 700 11px/1.2 var(--f-ui); color: var(--sub-ink); text-transform: uppercase; letter-spacing: .03em; padding-top: 4px; font-style: italic; }
.note { font-size: 11.5px; color: var(--muted); font-style: italic; }

.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font: 700 44px/1 var(--f-head); font-variant-numeric: tabular-nums; }
.score .of { color: var(--muted); font-family: var(--f-mono); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.legend b { font-family: var(--f-mono); }
.reveal { border-left: 3px solid var(--placard); padding: 6px 10px; background: var(--surface-2); border-radius: 0 6px 6px 0; }
.reveal .k { font: 700 10.5px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.reveal .v { font: 700 18px/1.15 var(--f-head); letter-spacing: .04em; text-transform: uppercase; }
textarea.export { width: 100%; min-height: 120px; font: 12px var(--f-mono); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }

/* ---------- option sheet ---------- */
.sheet-back { position: fixed; inset: 0; background: rgba(5, 8, 10, .45); z-index: 20; }
.sheet {
  position: fixed; z-index: 21; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(560px, 100%); max-height: 78vh; overflow-y: auto;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 12px 12px 0 0; box-shadow: var(--shadow);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.sh-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sh-t { font: 700 20px/1.1 var(--f-head); letter-spacing: .05em; text-transform: uppercase; }
.sh-s { color: var(--muted); font-size: 12.5px; }
.sh-o { display: flex; flex-direction: column; gap: 6px; }
.opt {
  cursor: pointer; text-align: left; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 7px; padding: 11px 12px; font: 700 13px/1.25 var(--f-ui); letter-spacing: .02em;
}
.opt:hover, .opt:focus-visible { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font: 700 11px var(--f-ui); }
.used { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.used b { font: 600 13px var(--f-head); letter-spacing: .06em; text-transform: uppercase; }

.toast {
  position: fixed; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translate(-50%, -150%);
  max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 7px; font: 700 13px var(--f-ui);
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow); transition: transform .2s ease; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); }
.toast.ok { background: var(--ok); color: #fff; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.warn { background: var(--warn); color: #fff; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>C150 Cockpit Drill</h1>
    <span class="reg">OO-ONE</span>
    <p>Reims F150M · APCK checklists (normal 8/11/2026, emergency 12/16/2025)</p>
  </header>

  <main class="app">
    <section class="cockpit" aria-label="Cockpit">
      <div class="runbar" id="runbar" hidden>
        <div class="rb-main">
          <div class="rb-title" id="rbTitle"></div>
          <div class="rb-sub" id="rbSub"></div>
        </div>
        <div class="rb-stats" id="rbStats"></div>
        <div class="rb-btns" id="rbBtns"></div>
      </div>

      <div class="stage-wrap">
        <div class="tools">
          <button type="button" id="zOut" aria-label="Zoom out">−</button>
          <button type="button" id="zIn" aria-label="Zoom in">+</button>
          <button type="button" id="lblBtn" aria-pressed="false">Names</button>
          <button type="button" id="editDone" hidden>Done adjusting</button>
        </div>
        <div class="stage-scroll" id="stageScroll">
          <div class="stage" id="stage">
            <img class="photo" src="figures/cockpit-panel.jpg" alt="Instrument panel of OO-ONE, a Reims F150M, seen from the left seat" draggable="false">
          </div>
        </div>
      </div>

      <div class="strip" id="strip"><span class="lbl">Outside the panel</span></div>
    </section>

    <aside class="side" id="side"></aside>
  </main>
</div>

<div class="sheet-back" id="sheetBack" hidden></div>

  <div class="sh-s" id="shS"></div>
  <div class="sh-o" id="shO"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ======================================================================
   Storage (per-device; the page works without it)
   ====================================================================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('c150drill.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('c150drill.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
const settings = Object.assign({ prime: '2', mode: 'practice', zoom: null }, store.get('settings', {}));
const progress = store.get('progress', {});
let layout = store.get('layout', {});

/* ======================================================================
   Controls. Rects are in pixels of the 2000×1200 panel photo.
   Each option is  key = "target:value", label, badge (badge = it changes state)
   ====================================================================== */
const o = (k, l, b) => ({ k, l, b });
const FI = o('fi:chk', 'FLIGHT INSTRUMENTS — CHECK');
const ENG = o('eng:green', 'ENGINE INSTRUMENTS — GREEN');
const RWY = o('rwy:chk', 'QFU / QNH / ELEVATION / TIME — CHECK');
const ALTSET = o('altm:set', 'ALTIMETER — SET');
const AVON = o('av:on', 'AVIONICS — ON', 'AV ON');
const AVOFF = o('av:off', 'AVIONICS — OFF', 'AV OFF');
const RADIOS = o('radios:set', 'FREQUENCIES / AUDIO PANEL / NAVAIDS — SET');
const VC = o('vents:closed', 'VENTS / CABIN AIR / HEAT — CLOSED (OFF)', 'CLOSED');
const VO = o('vents:open', 'VENTS / CABIN AIR / HEAT — OPEN', 'OPEN');
const ELEC = [
  o('elec:alloff', 'ALL ELECTRICAL SWITCHES — OFF'),
  o('elec:exign', 'ELECTRICAL SWITCHES (EXCEPT IGNITION) — OFF'),
  o('elec:oneby', 'ELECTRICAL SWITCHES — ON ONE AT A TIME, WITH DELAY'),
  o('elec:nonessoff', 'NON-ESSENTIAL EQUIPMENT — OFF')
];
const onoff = (t, name) => [o(t + ':on', name + ' — ON', 'ON'), o(t + ':off', name + ' — OFF', 'OFF')];
const SPEEDS = [50, 55, 60, 65, 68, 70, 85, 88, 93, 97].map(v => o('ias:' + v, v + ' KT', v + ' KT'));
const BRAKES = [
  o('brk:on', 'BRAKES — ON / SET', 'ON'), o('brk:chk', 'BRAKES — CHECK'), o('brk:apply', 'BRAKES — APPLY (HEAVILY)', 'APPLY'),
  o('brk:asrq', 'BRAKES — AS REQUIRED'), o('brk:off', 'BRAKES — RELEASE', 'OFF')
];

const CONTROLS = [
  { id: 'asi', n: 'Airspeed indicator', r: [[70, 140, 290, 360]], opts: [...SPEEDS, FI] },
  { id: 'ai', n: 'Attitude indicator', r: [[308, 165, 518, 372]], opts: [FI] },
  { id: 'suct', n: 'Suction gauge', r: [[266, 376, 332, 442]], opts: [o('suct:chk', 'SUCTION — CHECK'), ENG] },
  { id: 'clock', n: 'Clock / chronograph', r: [[538, 278, 675, 412]], opts: [o('timer:set', 'TIMER — SET'), RWY] },
  { id: 'alt1', n: 'Altimeter', r: [[693, 192, 882, 380]], opts: [ALTSET, RWY, FI] },
  { id: 'cdi', n: 'VOR / CDI', r: [[892, 205, 1075, 395]], opts: [RADIOS] },
  { id: 'tc', n: 'Turn coordinator', r: [[92, 438, 296, 590]], opts: [FI] },
  { id: 'dg', n: 'Directional gyro', r: [[318, 442, 512, 620]], opts: [o('dg:align', 'DG — ALIGN / CROSS-CHECK WITH COMPASS'), RWY, FI] },
  { id: 'vsi', n: 'Vertical speed indicator', r: [[696, 458, 872, 625]], opts: [FI] },
  { id: 'egt', n: 'EGT gauge', r: [[945, 478, 1055, 555]], opts: [ENG] },
  { id: 'audio', n: 'Audio panel', r: [[1355, 110, 1555, 195]], opts: [RADIOS, AVON, AVOFF] },
  { id: 'com', n: 'COM / NAV radio', r: [[1118, 195, 1480, 292]], opts: [RADIOS, o('atis:note', 'ATIS — LISTEN & NOTE'), o('radio:121', 'TRANSMIT ON 121.5 — POSITION'), AVON, AVOFF] },
  { id: 'xpdr', n: 'Transponder (Trig TT31)', r: [[1118, 295, 1462, 392]], opts: [o('xpdr:off', 'XPDR — OFF', 'OFF'), o('xpdr:sby', 'XPDR — STBY', 'STBY'), o('xpdr:gnd', 'XPDR — GND', 'GND'), o('xpdr:alt', 'XPDR — ALT', 'ALT'), AVON, AVOFF] },
  { id: 'elt', n: 'ELT panel', r: [[1178, 445, 1252, 555]], opts: [o('elt:armed', 'ELT — ARMED (CHECK)'), o('elt:on', 'ELT — ON', 'ON')] },

  { id: 'pbrake', n: 'Parking brake', r: [[140, 700, 215, 770]], opts: BRAKES },

  { id: 'fqty', n: 'Fuel quantity gauge', r: [[290, 692, 350, 746]], opts: [o('fq:chk', 'FUEL QUANTITY — CHECK'), ENG] },
  { id: 'oilp', n: 'Oil pressure gauge', r: [[795, 697, 880, 748]], opts: [o('oil:chk', 'OIL PRESSURE — CHECK'), ENG] },
  { id: 'lock', n: 'Control lock', r: [[120, 900, 410, 1000]], opts: [o('lock:off', 'CONTROL LOCK — REMOVE', 'OUT'), o('lock:on', 'CONTROL LOCK — INSTALL', 'IN')] },
  { id: 'yoke', n: 'Control wheel', r: [[868, 560, 985, 840], [355, 864, 790, 905]], opts: [o('ctl:free', 'FLIGHT CONTROLS — FREE & CORRECT'), o('ctl:tail', 'TOUCHDOWN — SLIGHTLY TAIL LOW'), o('ctl:nose', 'TOUCHDOWN — NOSEWHEEL FIRST'), o('ctl:slip', 'SIDESLIP — FLAMES AWAY FROM TANK & CABIN')] },
  { id: 'pedals', n: 'Rudder pedals / toe brakes', r: [[360, 965, 800, 1060]], opts: BRAKES },
  { id: 'doors', n: 'Door & window', r: [[0, 620, 92, 1150]], opts: [o('door:closed', 'WINDOWS / DOORS — CLOSED & LATCHED', 'CLOSED'), o('door:unlatch', 'DOORS — UNLATCH BEFORE TOUCHDOWN', 'UNLATCHED')] },
  { id: 'carb', n: 'Carburettor heat', r: [[985, 718, 1040, 795]], opts: [o('carb:on', 'CARB HEAT — ON (HOT)', 'HOT'), o('carb:off', 'CARB HEAT — OFF (COLD)', 'COLD'), o('carb:chk', 'CARB HEAT — CHECK'), o('carb:asrq', 'CARB HEAT — AS REQUIRED')] },
  { id: 'thr', n: 'Throttle', r: [[1078, 712, 1155, 790], [1125, 856, 1222, 945]], opts: [

  { id: 'mix', n: 'Mixture', r: [[1180, 712, 1245, 790], [1240, 800, 1328, 905]], opts: [
    o('mix:rich', 'MIXTURE — RICH', 'RICH'), o('mix:enrich', 'MIXTURE — ENRICH', 'RICH'), o('mix:set', 'MIXTURE — SET', 'SET'),

  { id: 'flaps', n: 'Wing flap switch', r: [[1262, 722, 1365, 798]], opts: [
    o('flap:up', 'FLAPS — UP (RETRACT)', 'UP'), o('flap:10', 'FLAPS — 10°', '10°'), o('flap:20', 'FLAPS — 20°', '20°'),
    o('flap:30', 'FLAPS — 30°', '30°'), o('flap:40', 'FLAPS — 40°', '40°'), o('flap:to', 'FLAPS — SET FOR TAKE-OFF', 'T/O'),
    o('flap:asrq', 'FLAPS — AS REQUIRED')] },
  { id: 'cabair', n: 'Cabin air', r: [[1400, 712, 1468, 785]], opts: [VC, VO] },
  { id: 'cabht', n: 'Cabin heat', r: [[1515, 728, 1575, 792]], opts: [VC, VO] },
  { id: 'cb', n: 'Circuit breakers', r: [[1040, 812, 1238, 856], [1330, 812, 1458, 856]], opts: [o('cb:chk', 'CIRCUIT BREAKERS — CHECK (ALL IN)'), o('cb:noreset', 'CIRCUIT BREAKERS — CHECK, DO NOT RESET'), o('cb:reset', 'CIRCUIT BREAKERS — RESET ALL')] },
  { id: 'trim', n: 'Elevator trim wheel', r: [[928, 862, 1000, 1000]], opts: [o('trim:set', 'TRIM — SET', 'SET')] },

  // drawn over the yoke (hidden in the photo) and the floor inset
  { id: 'master', n: 'Master switch (BAT | ALT)', inset: 'yoke', opts: [o('master:on', 'MASTER (BAT + ALT) — ON', 'ON'), o('master:off', 'MASTER (BAT + ALT) — OFF', 'OFF'), o('master:altoff', 'ALT SIDE — OFF (BAT STAYS ON)', 'BAT')] },
  { id: 'ign', n: 'Magnetos / ignition key', inset: 'yoke', opts: [
    o('ign:off', 'MAGNETOS — OFF', 'OFF'), o('ign:both', 'MAGNETOS — BOTH', 'BOTH'), o('ign:start', 'KEY — START', 'START'),
    o('ign:crank', 'KEY — KEEP CRANKING', 'START'), o('ign:mag175', 'MAG CHECK — MAX DROP 175, MAX DIFF 75', 'BOTH'),
    o('ign:mag125', 'MAG CHECK — MAX DROP 125, MAX DIFF 50', 'BOTH')] },
  { id: 'pitot', n: 'Pitot heat switch', inset: 'yoke', short: 'PITOT', opts: [...onoff('pitot', 'PITOT HEAT'), o('pitot:asrq', 'PITOT HEAT — AS REQUIRED'), ...ELEC] },
  { id: 'bcn', n: 'Beacon switch', inset: 'yoke', short: 'BCN', opts: [...onoff('bcn', 'BEACON'), ...ELEC] },
  { id: 'nav', n: 'Nav lights switch', inset: 'yoke', short: 'NAV', opts: [...onoff('nav', 'NAV LIGHTS'), ...ELEC] },
  { id: 'strobe', n: 'Strobe switch', inset: 'yoke', short: 'STROBE', opts: [...onoff('strobe', 'STROBES'), ...ELEC] },
  { id: 'taxi', n: 'Taxi light switch', inset: 'yoke', short: 'TAXI', opts: [...onoff('taxi', 'TAXI LIGHT'), ...ELEC] },
  { id: 'ldg', n: 'Landing light switch', inset: 'yoke', short: 'LDG', opts: [...onoff('ldg', 'LANDING LIGHT'), ...ELEC] },
  { id: 'fuel', n: 'Fuel valve (floor)', inset: 'fuel', opts: [o('fuel:on', 'FUEL VALVE — ON', 'ON'), o('fuel:off', 'FUEL VALVE — OFF', 'OFF')] },

  // things you do away from the panel
  { id: 'walk', n: 'Walk-around', strip: true, opts: [o('wa:safety', 'SAFETY CHECK — PERFORMED'), o('wa:oil', 'ENGINE OIL — CHECKED'), o('wa:drain', 'FUEL DRAINS (4) — PERFORM')] },
  { id: 'docs', n: 'Papers', strip: true, opts: [o('papers:on', 'PAPERS — ON BOARD'), o('trouble:chk', 'TROUBLE REPORT — CHECKED')] },
  { id: 'gear', n: 'Ground equipment', strip: true, opts: [o('chocks:off', 'CHOCKS & TOW BAR — REMOVED'), o('pcover:off', 'PITOT COVER — REMOVED'), o('pcover:on', 'PITOT COVER — INSTALL')] },
  { id: 'belts', n: 'Seats & belts', strip: true, opts: [o('belts:on', 'SEATS & BELTS — FASTENED')] },
  { id: 'look', n: 'Look outside', strip: true, opts: [o('scan:done', 'SCAN — COMPLETED'), o('runup:free', 'RUN-UP AREA — FREE'), o('field:fly', 'FIELD — FLY OVER, NOTE TERRAIN & OBSTRUCTIONS')] },
  { id: 'brief', n: 'Briefings', strip: true, opts: [o('tobrief:done', 'TAKE-OFF BRIEFING — PERFORMED'), o('depbrief:done', 'DEPARTURE BRIEFING — PERFORMED')] },
  { id: 'ext', n: 'Fire extinguisher', strip: true, opts: [o('ext:obtain', 'FIRE EXTINGUISHER — OBTAIN'), o('ext:activate', 'FIRE EXTINGUISHER — ACTIVATE'), o('fire:ext', 'FIRE — EXTINGUISH')] },
  { id: 'engine', n: 'Engine & damage', strip: true, opts: [o('engine:secure', 'ENGINE — SECURE'), o('engine:shut', 'SHUT DOWN ENGINE & INSPECT DAMAGE'), o('dmg:inspect', 'DAMAGE — INSPECT')] },
  { id: 'land', n: 'Land / terminate', strip: true, opts: [o('land:asap', 'LAND ASAP'), o('term:asap', 'TERMINATE FLIGHT — ASAP'), o('term:practical', 'TERMINATE FLIGHT — AS SOON AS PRACTICAL'), o('fld:exec', 'FORCED LANDING — EXECUTE')] },
  { id: 'ditch', n: 'Ditching', strip: true, opts: [o('heavy:secure', 'HEAVY OBJECTS (BAGGAGE) — SECURE / JETTISON'), o('ditchhdg:ok', 'HEADING — INTO WIND IF HEAVY SEA, PARALLEL TO SWELL IF HIGH SWELL'), o('ditchhdg:across', 'HEADING — ACROSS THE SWELL'), o('cushion:face', 'FACE CUSHION AT TOUCHDOWN (FOLDED COAT)'), o('evac:go', 'EVACUATE — VEST & RAFT INFLATE')] }
];
const CTRL = Object.fromEntries(CONTROLS.map(c => [c.id, c]));
const OPT = {};          // key -> option
const OWNERS = {};       // key -> [control ids]
CONTROLS.forEach(c => c.opts.forEach(op => { OPT[op.k] = op; (OWNERS[op.k] = OWNERS[op.k] || []).push(c.id); }));
const INSETS = { yoke: [355, 645, 790, 862], fuel: [1070, 995, 1340, 1197] };
const ROCKERS = ['pitot', 'bcn', 'nav', 'strobe', 'taxi', 'ldg'];

/* ======================================================================
   Checklists, transcribed from the club cards.
   rows: [item, value, accepted keys separated by |]   or   '§subheading'
   ====================================================================== */
const PH = [];
const P = (id, name, group, hdr, rows, extra = {}) => PH.push(Object.assign({ id, name, group, hdr, rows }, extra));
const ANYFLAP = 'flap:asrq|flap:up|flap:10|flap:20|flap:30|flap:40';

P('walk', 'Walk around (AFM)', 'normal', 'gray', [
  ['SAFETY CHECK', 'PERFORMED', 'wa:safety'], ['ENGINE OIL', 'CHECKED', 'wa:oil'], ['FUEL DRAINS (4)', 'PERFORM', 'wa:drain']]);
P('beforestart', 'Before start', 'normal', 'teal', [
  ['PAPERS', 'ON BOARD', 'papers:on'], ['TROUBLE REPORT', 'CHECKED', 'trouble:chk'], ['SCAN', 'COMPLETED', 'scan:done'],
  ['CHOCKS AND TOW BAR', 'REMOVED', 'chocks:off'], ['PITOT COVER', 'REMOVED', 'pcover:off'], ['SEATS & BELTS', 'FASTENED', 'belts:on'],
  ['AVIONICS', 'OFF', 'av:off'], ['ELECTRICAL SWITCHES', 'ALL OFF', 'elec:alloff'], ['MAGNETOS', 'OFF', 'ign:off'],
  ['BATT / ALT', 'OFF', 'master:off'], ['TRIM', 'SET', 'trim:set'], ['FUEL SELECTOR', 'ON', 'fuel:on'], ['BRAKES', 'ON', 'brk:on'],
  ['FLIGHT CONTROLS', 'FREE / CORRECT', 'ctl:free'], ['BATT / ALT', 'ON', 'master:on'], ['CIRCUIT BREAKERS', 'CHECK', 'cb:chk'],
  ['BCN LIGHT', 'ON', 'bcn:on']]);
P('enginestart', 'Engine start', 'normal', 'teal', [
  ['PRIME', '@prime', '@prime'], ['MIXTURE', 'RICH', 'mix:rich'], ['THROTTLE', '1/4 (0,6 CM)', 'thr:q'], ['START', '', 'ign:start']],
  { note: 'Check AFM if unsuccessful.' });
P('afterstart', 'After start / before taxi', 'normal', 'teal', [
  ['AMPS', 'CHECKED', 'amps:chk'], ['OIL PRESSURE', 'CHECKED', 'oil:chk'], ['SUCTION', 'CHECKED', 'suct:chk'], ['AVIONICS', 'ON', 'av:on'],
  ['FREQ / AUDIO PANEL', 'SET', 'radios:set'], ['XPDR MODE', 'STBY / GND', 'xpdr:sby|xpdr:gnd'], ['TIMER', 'SET', 'timer:set'],
  ['FLIGHT INSTRUMENTS', 'CHECKED', 'fi:chk'], ['ATIS', 'NOTE', 'atis:note'], ['ALTIMETER', 'SET', 'altm:set'], ['NAV LIGHTS', 'ON', 'nav:on'],
  ['FLAPS', 'UP / AS RQRD', 'flap:up|flap:asrq']]);
P('taxi', 'Taxi', 'normal', 'gray', [['TAXI LIGHT', 'ON', 'taxi:on'], ['BRAKES', 'CHECK', 'brk:chk'], ['FLIGHT INSTRUMENTS', 'CHECK', 'fi:chk']]);
P('runup', 'Run up', 'normal', 'gray', [
  ['BRAKES', 'SET', 'brk:on'], ['TAXI LIGHT', 'OFF', 'taxi:off'], ['ENGINE INSTR', 'GREEN', 'eng:green'], ['RUN UP AREA', 'FREE', 'runup:free'],
  ['MIXTURE', 'RICH', 'mix:rich'], ['THROTTLE', '1700 RPM', 'thr:1700'], ['CARB HEAT', 'CHECKED', 'carb:chk'],
  ['MAGNETO CHECK', '175 / 75', 'ign:mag175'], ['IDLE (BTWN 600 & 900)', 'CHECKED', 'thr:idlechk|rpm:idle']]);
P('beforeto', 'Before take off', 'normal', 'yellow', [
  ['WINDOWS / DOORS', 'CLOSED', 'door:closed'], ['SEATS / BELTS', 'FASTENED', 'belts:on'], ['FUEL SELECTOR', 'ON', 'fuel:on'],
  ['FUEL QTY', 'CHECKED', 'fq:chk'], ['FLIGHT INSTRUMENTS', 'CHECKED', 'fi:chk'], ['RADIOS & NAVAIDS', 'SET', 'radios:set'],
  ['ALTIMETER', 'SET', 'altm:set'], ['FLAPS', 'SET FOR T/O', 'flap:to|flap:up|flap:10'], ['MIXTURE', 'RICH', 'mix:rich'], ['TRIM', 'SET', 'trim:set'],
  ['MAGNETOS', 'BOTH', 'ign:both'], ['T/O BRIEFING', 'PERFORMED', 'tobrief:done'], ['DEP BRIEFING', 'PERFORMED', 'depbrief:done']]);
P('lineup', 'Line up', 'normal', 'gray', [
  ['PITOT HEAT', 'AS RQRD', 'pitot:asrq|pitot:on|pitot:off'], ['LDG LIGHT', 'ON', 'ldg:on'], ['XPDR', 'ALT', 'xpdr:alt'],
  ['MIXTURE', 'SET', 'mix:set|mix:rich'], ['TRIM', 'SET', 'trim:set'], ['FUEL SELECTOR', 'ON', 'fuel:on']]);
P('onrwy', 'On runway', 'normal', 'gray', [['QFU / QNH ELEV. / TIME', 'CHECKED', 'rwy:chk']]);
P('takeoff', 'Take off', 'normal', 'gray', [
  ['POWER', 'MIN 2400', 'thr:full|rpm:2400'], ['Vr', '50 KTS', 'ias:50'], ['Vx FLAPS 10 - CLEAN', '60 KTS', 'ias:60'], ['Vy', '68 KTS', 'ias:68']]);
P('aftertakeoff', 'After take off', 'normal', 'gray', [
  ['LDG LIGHT', 'OFF', 'ldg:off'], ['ENGINE INSTR', 'GREEN', 'eng:green'], ['XPDR', 'ON / CHECKED', 'xpdr:alt'], ['FLAPS', 'UP', 'flap:up']]);
P('cruise', 'Cruise', 'normal', 'gray', [
  ['CRUISE POWER', 'SET', 'thr:cruise'], ['MIXTURES', "ADJUST ABV 3000' DENS ALT", 'mix:lean'],
  ['ENGINE & CARB HEAT', 'CHECK', 'carb:chk|eng:green'], ['DG', 'X-CHECK', 'dg:align']], { note: 'Every 10 minutes, approximately.' });
P('descent', 'Descent', 'normal', 'gray', [['THROTTLE', 'ADJUST', 'thr:adj'], ['MIXTURES', 'ENRICH', 'mix:enrich|mix:rich'], ['ALTIMETERS', 'SET', 'altm:set']]);
P('approach', 'Approach', 'normal', 'gray', [
  ['SCAN', 'COMPLETED', 'scan:done'], ['LDG LIGHT', 'ON', 'ldg:on'], ['DIRECTIONAL GYROS', 'ALIGNED', 'dg:align'], ['ALTIMETERS', 'SET', 'altm:set'],

P('beforeland', 'Before landing', 'normal', 'gray', [['FLAPS', 'AS REQUIRED', ANYFLAP], ['CARB HEAT', 'AS REQUIRED', 'carb:asrq|carb:on|carb:off']]);
P('afterland', 'After landing', 'normal', 'teal', [
  ['PITOT HEAT', 'OFF', 'pitot:off'], ['LANDING LIGHT', 'OFF', 'ldg:off'], ['TAXI LIGHT', 'ON', 'taxi:on'], ['CARB HT', 'COLD / OFF', 'carb:off'],
  ['FLAPS', 'UP', 'flap:up'], ['XPDR', 'GND / STBY', 'xpdr:gnd|xpdr:sby']]);
P('shutdown', 'Shutdown', 'normal', 'teal', [

const USED = {};

    const dx = (ev.clientX - x0) / r.width * 100, dy = (ev.clientY - y0) / r.height * 100;
    const b = resize ? [s[0], s[1], Math.max(1.2, s[2] + dx), Math.max(1.2, s[3] + dy)] : [s[0] + dx, s[1] + dy, s[2], s[3]];

  };

});

/* ======================================================================
   Progress & spaced repetition (Leitner boxes)
   ====================================================================== */
const DAY = 864e5, IVL = [0, 1, 2, 4, 8, 16].map(d => d * DAY);
function status(pid) {
  const p = progress[pid];
  if (!p) return { cls: 'new', txt: 'New', due: true, box: 0, last: 0 };
  const due = Date.now() - p.last >= IVL[p.box];
  return { cls: due ? 'due' : 'ok', txt: due ? 'Due' : '●'.repeat(p.box) + '○'.repeat(5 - p.box), due, box: p.box, last: p.last };
}
function record(pid, perfect, frac, mode) {
  const p = progress[pid] || { box: 0, runs: 0, best: 0, last: 0 };
  p.runs++; p.last = Date.now(); p.best = Math.max(p.best, pct(frac));
  const cap = mode === 'test' ? 5 : 3;
  if (perfect) p.box = Math.max(p.box, Math.min(cap, p.box + 1));
  else if (frac >= 0.8) p.box = Math.max(1, p.box);
  else p.box = 1;
  progress[pid] = p; store.set('progress', progress);
}
function nextUp() {
  const idx = id => PH.findIndex(p => p.id === id);
  return PH.map(p => ({ p, s: status(p.id) })).sort((a, b) =>
    (a.s.due === b.s.due ? 0 : a.s.due ? -1 : 1) || (a.s.box - b.s.box) ||
    (a.s.last && b.s.last ? a.s.last - b.s.last : idx(a.p.id) - idx(b.p.id)))[0].p;
}
function randomEmergency() {
  const pool = PH.filter(p => p.group === 'emergency' && !p.quiz);
  const w = pool.map(p => { const s = status(p.id); return (6 - s.box) * (s.due ? 2 : 0.5); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

/* ======================================================================
   Running a drill
   ====================================================================== */
let run = null, tick = null;

function startRun(queue, opts = {}) {
  closeSheet();
  if (editing) setEditing(false);
  run = { queue, qi: 0, mode: settings.mode, scenario: !!opts.scenario, results: [], t0: Date.now(), done: false };
  states = {};
  loadPhase();
  clearInterval(tick); tick = setInterval(renderStats, 500);
  $('#runbar').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function loadPhase() {
  const p = PHASE[run.queue[run.qi]];
  Object.assign(run, { p, steps: stepsOf(p), idx: 0, tries: 0, mistakes: 0, marks: [], actions: [], phaseT0: Date.now() });
  if (run.queue.length === 1) states = {};
  clearHints();
  renderRun();
}
function renderRun() {
  const p = run.p, multi = run.queue.length > 1;
  const tag = p.group === 'emergency' ? '<span class="tag em">Emergency</span>' : '<span class="tag">' + (multi ? 'Flight ' + (run.qi + 1) + '/' + run.queue.length : 'Normal') + '</span>';
  $('#rbTitle').innerHTML = tag + (run.scenario ? 'What do you do?' : esc(p.name));
  const sub = $('#rbSub');
  sub.classList.toggle('scen', !!(p.scen && (run.scenario || p.group === 'emergency')));
  if (p.quiz) {
    const s = run.mode === 'test' ? run.steps[run.actions.length] : run.steps[run.idx];
    sub.textContent = s ? s.l + ': which speed? Tap the airspeed indicator.' : 'All answered. Press Done.';
    sub.classList.add('scen');
  } else if (p.scen) sub.textContent = p.scen;
  else sub.textContent = run.mode === 'test' ? 'From memory. No feedback until you press Done.' : 'From memory: tap the control for the next item, then choose its setting.';
  const btns = $('#rbBtns');
  btns.innerHTML = run.mode === 'practice'
    ? '<button type="button" class="btn small" id="bHint">Hint</button><button type="button" class="btn small" id="bShow">Show answer</button><button type="button" class="btn small ghost" id="bQuit">Stop</button>'
    : '<button type="button" class="btn small" id="bUndo">Undo</button><button type="button" class="btn small primary" id="bDone">Done</button><button type="button" class="btn small ghost" id="bQuit">Stop</button>';
  if (run.mode === 'practice') { $('#bHint').onclick = () => hint(1); $('#bShow').onclick = () => hint(2); }
  else { $('#bUndo').onclick = undo; $('#bDone').onclick = finishPhase; }
  $('#bQuit').onclick = () => { stopRun(); showMenu(); };
  renderStats(); renderCard(); renderStates();
}
function renderStats() {
  if (!run || run.done) return;
  const n = run.steps.length;
  const pos = run.mode === 'practice' ? 'Item ' + Math.min(run.idx + 1, n) + '/' + n : run.actions.length + ' done · ' + n + ' items';
  const t = fmtTime(Date.now() - (run.queue.length > 1 ? run.t0 : run.phaseT0));
  $('#rbStats').innerHTML = '<span>' + pos + '</span>' + (run.mode === 'practice' ? '<span class="err">✗ ' + run.mistakes + '</span>' : '') + '<span>' + t + '</span>';
}
function stopRun() { run = null; clearInterval(tick); $('#runbar').hidden = true; clearHints(); }

function line(cls, ic, it, vl) {
  return '<div class="ln ' + cls + '"><span class="ic">' + ic + '</span><span class="it">' + esc(it) + '</span><span class="dt"></span><span class="vl">' + esc(vl) + '</span></div>';
}
function cardHead(p, hideName) {
  return '<div class="card-h ' + p.hdr + '">' + (hideName ? 'Emergency' : esc(p.name)) + '</div>';
}
function renderCard() {
  const p = run.p, hideName = run.scenario;
  let h = '';
  if (run.mode === 'practice') {
    let si = 0;
    p.rows.forEach(r => {
      if (typeof r === 'string') { if (si <= run.idx && !hideName) h += '<div class="sub">' + esc(r.slice(1)) + '</div>'; return; }
      const s = run.steps[si], m = run.marks[si];
      if (si < run.idx) h += line(m === 'clean' ? 'clean' : m === 'shown' ? 'shown' : 'retry', m === 'clean' ? '✓' : m === 'shown' ? '•' : '!', s.l, s.v);
      else if (si === run.idx && run.tries >= 3) h += line('cue', '→', s.l, s.v);
      else h += '<div class="ln ph"><span class="ic">' + (si + 1) + '</span><span class="bar"></span></div>';
      si++;
    });
  } else {
    h = run.actions.length ? run.actions.map((a, i) => line('act', i + 1, a.op.l, '')).join('') : '<div class="note">Your actions appear here.</div>';
  }
  side.innerHTML = '<div class="panel">' +
    '<div class="card">' + cardHead(p, hideName) + '<div class="lines">' + h + '</div></div>' +
    (p.note && run.mode === 'practice' && !hideName ? '<div class="note">' + esc(p.note) + '</div>' : '') +
    (run.mode === 'practice' ? '<div class="legend"><span><b>✓</b> first try</span><span><b>!</b> after a mistake</span><span><b>•</b> answer shown</span></div>' : '') +
    '</div>';
}

function clearHints() { document.querySelectorAll('.pulse').forEach(el => el.classList.remove('pulse')); }
function hint(level) {
  if (!run || run.done || run.mode !== 'practice') return;
  const s = run.steps[run.idx]; if (!s) return;
  run.tries = Math.max(run.tries, level === 1 ? 2 : 3);
  if (level >= 1) {
    const ids = new Set(s.a.flatMap(k => OWNERS[k] || []));
    clearHints();
    let first = null;
    ids.forEach(id => document.querySelectorAll('[data-c="' + id + '"]').forEach(el => { el.classList.add('pulse'); first = first || el; }));
    if (first && stage.contains(first)) first.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  renderCard();
}

function pick(cid, op) {
  if (!run || run.done) return;
  if (run.mode === 'test') {
    run.actions.push({ cid, op });
    applyOpt(cid, op, states); renderStates(); flash(cid, 'flash-ok');
    if (run.p.quiz) renderRun(); else renderCard();
    return;
  }
  const s = run.steps[run.idx];
  if (s.a.includes(op.k)) {
    run.marks[run.idx] = run.tries >= 3 ? 'shown' : run.tries > 0 ? 'retry' : 'clean';
    applyOpt(cid, op, states); renderStates();
    flash(cid, 'flash-ok'); clearHints();
    toast('✓ ' + s.l + (s.v ? ' — ' + s.v : ''), 'ok');
    run.idx++; run.tries = 0;
    if (run.idx >= run.steps.length) { finishPhase(); return; }
    if (run.p.quiz) renderRun(); else { renderCard(); renderStats(); }
  } else {
    run.tries++; run.mistakes++;
    flash(cid, 'flash-bad');
    const rightControl = s.a.some(k => (OWNERS[k] || []).includes(cid));
    toast(rightControl ? 'Right control, wrong setting' : 'Not the next item', rightControl ? 'warn' : 'bad');
    if (run.tries >= 3) hint(2); else if (run.tries >= 2) hint(1); else renderStats();
  }
}
function undo() {
  if (!run || !run.actions.length) return;
  run.actions.pop();
  states = run.queue.length > 1 ? Object.assign({}, run.statesAtPhaseStart || {}) : {};
  run.actions.forEach(a => applyOpt(a.cid, a.op, states));
  renderStates();
  if (run.p.quiz) renderRun(); else renderCard();
}

/* Longest common subsequence between expected steps and what was done */
function grade(steps, actions) {
  const n = steps.length, m = actions.length;
  const ok = (i, j) => steps[i].a.includes(actions[j].op.k);
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = ok(i, j) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const st = new Array(n).fill('miss'), used = new Array(m).fill(false);
  for (let i = 0, j = 0; i < n && j < m;) {
    if (ok(i, j) && L[i][j] === L[i + 1][j + 1] + 1) { st[i] = 'ok'; used[j] = true; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  st.forEach((v, i) => { if (v === 'miss') { const j = actions.findIndex((a, jj) => !used[jj] && ok(i, jj)); if (j >= 0) { st[i] = 'order'; used[j] = true; } } });
  const extras = actions.filter((a, j) => !used[j]);
  return { st, extras };
}

function finishPhase() {
  if (!run || run.done) return;
  const p = run.p, n = run.steps.length;
  let res;
  if (run.mode === 'practice') {
    const clean = run.marks.filter(m => m === 'clean').length;
    res = { p, mode: 'practice', n, good: clean, frac: clean / n, perfect: clean === n, mistakes: run.mistakes,
      lines: run.steps.map((s, i) => ({ s, st: run.marks[i] || 'shown' })), extras: [], time: Date.now() - run.phaseT0 };
  } else {
    const g = grade(run.steps, run.actions);
    const okc = g.st.filter(x => x === 'ok').length;
    res = { p, mode: 'test', n, good: okc, frac: Math.max(0, okc - g.extras.length * 0.5) / n, perfect: okc === n && !g.extras.length,
      lines: run.steps.map((s, i) => ({ s, st: g.st[i] })), extras: g.extras, time: Date.now() - run.phaseT0 };
  }
  record(p.id, res.perfect, res.frac, res.mode);
  run.results.push(res);
  if (run.qi < run.queue.length - 1) {
    run.qi++;
    run.statesAtPhaseStart = Object.assign({}, states);
    toast('Next: ' + PHASE[run.queue[run.qi]].name.toUpperCase());
    loadPhase();
    return;
  }
  run.done = true; clearInterval(tick); clearHints();
  showResults();
}

/* ======================================================================
   Side panels: menu, results, adjust
   ====================================================================== */
function rowHtml(p) {
  const s = status(p.id), n = stepsOf(p).length;
  return '<button type="button" class="row" data-p="' + p.id + '"><span class="nm">' + esc(p.name) + '</span><span class="ct">' + n + '</span><span class="pill ' + s.cls + '">' + s.txt + '</span></button>';
}
function showMenu() {
  const nu = nextUp(), ns = status(nu.id);
  const normal = PH.filter(p => p.group === 'normal'), emerg = PH.filter(p => p.group === 'emergency');
  side.innerHTML =
    '<div class="panel">' +
      '<div class="seg" role="group" aria-label="Mode"><button type="button" data-m="practice" aria-pressed="' + (settings.mode === 'practice') + '">Practice</button><button type="button" data-m="test" aria-pressed="' + (settings.mode === 'test') + '">Test</button></div>' +
      '<p class="small muted">' + (settings.mode === 'practice'
        ? 'Practice gives feedback on every tap. After two mistakes the right control flashes; after three you see the answer.'
        : 'Test gives no feedback while you work. Press Done to see what you got right, what was out of order and what you missed.') + '</p>' +
      '<button type="button" class="next" data-p="' + nu.id + '"><span class="k">Next up · ' + (ns.cls === 'new' ? 'new' : ns.due ? 'due for review' : 'weakest') + '</span><span class="v">' + esc(nu.name) + '</span><span class="s">' + stepsOf(nu).length + ' items</span></button>' +
      '<div class="btnrow"><button type="button" class="btn primary" id="bScen">Random emergency</button><button type="button" class="btn" id="bFlight">Full flight</button></div>' +
      '<h2>Normal checklist</h2><div class="list">' + normal.map(rowHtml).join('') + '</div>' +
      '<h2>Emergency checklist</h2><div class="list">' + emerg.map(rowHtml).join('') + '</div>' +
      '<h2>Panel</h2>' +
      '<p class="small muted">Tap any control to see its settings and where it appears on the cards. “Names” in the photo corner labels everything.</p>' +
      '<div class="btnrow"><button type="button" class="btn" id="bAdjust">Adjust tap areas</button></div>' +
      '<h2>Aircraft</h2>' +
      '<p class="small muted">Priming strokes on the card: blue column 2, red column 0,5. Pick the one for the aircraft you fly.</p>' +
      '<div class="seg" role="group" aria-label="Priming strokes"><button type="button" data-prime="2" aria-pressed="' + (settings.prime === '2') + '">Prime 2</button><button type="button" data-prime="05" aria-pressed="' + (settings.prime === '05') + '">Prime 0,5</button></div>' +
      '<p class="small muted">The master switch, magneto key and light switches sit behind the left yoke in every photo, so that strip is drawn. Its layout is approximate.</p>' +
    '</div>';
  side.querySelectorAll('[data-p]').forEach(b => b.onclick = () => startRun([b.dataset.p]));
  side.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { settings.mode = b.dataset.m; store.set('settings', settings); showMenu(); });
  side.querySelectorAll('[data-prime]').forEach(b => b.onclick = () => { settings.prime = b.dataset.prime; store.set('settings', settings); Object.keys(USED).forEach(k => delete USED[k]); showMenu(); });
  $('#bScen').onclick = () => startRun([randomEmergency().id], { scenario: true });
  $('#bFlight').onclick = () => startRun(FLIGHT.slice());
  $('#bAdjust').onclick = () => setEditing(true);
}

function resultLines(r) {
  const icon = { clean: '✓', ok: '✓', retry: '!', order: '↕', shown: '•', miss: '✗' };
  let si = 0, h = '';
  r.p.rows.forEach(row => {
    if (typeof row === 'string') { h += '<div class="sub">' + esc(row.slice(1)) + '</div>'; return; }
    const L = r.lines[si++];
    h += line(L.st, icon[L.st], L.s.l, L.s.v);
  });
  if (r.extras.length) h += '<div class="sub">Not on this card</div>' + r.extras.map(a => line('extra', '+', a.op.l, '')).join('');
  return h;
}
function showResults() {
  const rs = run.results, multi = rs.length > 1;
  const tot = rs.reduce((a, r) => a + r.n, 0), good = rs.reduce((a, r) => a + r.good, 0);
  const time = Date.now() - run.t0;
  const r0 = rs[0];
  const head = run.scenario ? '<div class="reveal"><div class="k">This was</div><div class="v">' + esc(r0.p.name) + '</div></div>' : '';
  const legend = run.mode === 'practice'
    ? '<div class="legend"><span><b>✓</b> first try</span><span><b>!</b> after a mistake</span><span><b>•</b> answer shown</span></div>'
    : '<div class="legend"><span><b>✓</b> in order</span><span><b>↕</b> done, out of order</span><span><b>✗</b> missed</span><span><b>+</b> not on the card</span></div>';
  const detail = multi
    ? rs.map(r => '<div class="card">' + cardHead(r.p) + '<div class="lines">' + resultLines(r) + '</div></div>').join('')
    : '<div class="card">' + cardHead(r0.p) + '<div class="lines">' + resultLines(r0) + '</div></div>';
  const extraCount = rs.reduce((a, r) => a + r.extras.length, 0), mistakes = rs.reduce((a, r) => a + (r.mistakes || 0), 0);
  side.innerHTML = '<div class="panel">' + head +
    '<div class="score"><span class="big">' + good + '<span class="of">/' + tot + '</span></span><span class="muted">' +
      (run.mode === 'practice' ? 'first try · ' + mistakes + ' mistake' + (mistakes === 1 ? '' : 's') : 'in order' + (extraCount ? ' · ' + extraCount + ' extra' : '')) +
      ' · ' + fmtTime(time) + '</span></div>' +
    '<div class="btnrow"><button type="button" class="btn primary" id="bAgain">Again</button><button type="button" class="btn" id="bNext">Next up</button><button type="button" class="btn ghost" id="bMenu">Menu</button></div>' +
    legend + detail + '</div>';
  const q = run.queue.slice(), sc = run.scenario;
  $('#bAgain').onclick = () => startRun(sc ? [randomEmergency().id] : q, { scenario: sc });
  $('#bNext').onclick = () => startRun([nextUp().id]);
  $('#bMenu').onclick = () => { stopRun(); showMenu(); };
  $('#rbTitle').innerHTML = '<span class="tag">Finished</span>' + esc(multi ? 'Full flight' : r0.p.name);
  $('#rbSub').textContent = r0.perfect && !multi ? 'Clean run.' : 'Results are in the side panel.';
  $('#rbSub').classList.remove('scen');
  $('#rbStats').innerHTML = '<span>' + good + '/' + tot + '</span><span>' + fmtTime(time) + '</span>';
  $('#rbBtns').innerHTML = '';
  if (window.innerWidth < 1100) side.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showAdjust() {
  const changed = Object.keys(layout).length;
  side.innerHTML = '<div class="panel">' +
    '<h2>Adjust tap areas</h2>' +
    '<p>Drag a box to move it. Drag the yellow dot in its corner to resize it. Changes are saved on this device.</p>' +
    '<p class="small muted"><span id="chgCount">' + changed + ' area' + (changed === 1 ? '' : 's') + ' changed</span>. To make a fix permanent for everyone, copy the layout and send it to Claude.</p>' +
    '<div class="btnrow"><button type="button" class="btn primary" id="bCopy">Copy layout</button><button type="button" class="btn" id="bReset">Reset all</button><button type="button" class="btn ghost" id="bEditDone">Done</button></div>' +
    '<textarea class="export" id="exportBox" readonly hidden aria-label="Layout JSON"></textarea>' +
    '</div>';
  $('#bCopy').onclick = () => {
    const txt = JSON.stringify(layout);
    const ta = $('#exportBox'); ta.value = txt; ta.hidden = false;
    const fallback = () => { ta.focus(); ta.select(); toast('Select the text and copy it'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Layout copied', 'ok'), fallback); } catch (e) { fallback(); }
  };
  $('#bReset').onclick = () => {
    const b = $('#bReset');
    if (b.dataset.armed) { layout = {}; store.set('layout', layout); applyLayout(); renderStates(); showAdjust(); toast('Tap areas reset'); }
    else { b.dataset.armed = '1'; b.textContent = 'Tap again to reset'; }
  };
  $('#bEditDone').onclick = () => setEditing(false);
}

/* ======================================================================
   Boot
   ====================================================================== */
window.C150_DRILL = { phases: PH, controls: CTRL, owners: OWNERS, steps: stepsOf };
setZoom(zi);
const sc = $('#stageScroll');
if (ZOOMS[zi] > 1) sc.scrollLeft = stage.offsetWidth * 0.16;
renderStates();
showMenu();
})();
</script>
</body>
</html>
